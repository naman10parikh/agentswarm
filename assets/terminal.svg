<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">agentswarm --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: agentswarm [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">CEO orchestration for AI agent swarms</text>
<text x="24" y="146" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  -V, --version                       output the version number</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -h, --help                          display help for command</text>
<text x="24" y="226" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  run [options] &lt;config&gt;              Deploy a swarm from config</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  validate &lt;config&gt;                   Validate a swarm config</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  status &lt;session&gt;                    Show status of a running swarm</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  stop &lt;session&gt;                      Stop a running swarm</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  list                                List running swarm sessions</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  memory-search [options] &lt;query...&gt;  BM25 search over this repo's own knowledge</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                                      corpus</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  log [options]                       Show the recent run-log audit trail</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                                      (logs/runs.jsonl)</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  sandbox-run &lt;config&gt;                Validate a swarm.yaml inside an isolated</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                                      E2B sandbox</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  help [command]                      display help for command</text>
</svg>
